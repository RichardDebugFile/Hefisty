[project]
name = "hefisty"
version = "0.1.0"
description = "Sistema de IAs locales orquestadas: Hefisty conversa, clasifica y delega en agentes especializados"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Richard Hidalgo", email = "123910016+RichardDebugFile@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "litellm>=1.50",
    "qdrant-client>=1.12",
    "redis>=5.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
hefisty = "hefisty.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI y Typer usan llamadas como valores por defecto (Depends/Header/Argument...).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "typer.Argument",
    "typer.Option",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hefisty"]
